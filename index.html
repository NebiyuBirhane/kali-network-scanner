<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kali Network Topology Scanner</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #38bdf8; margin: 0; padding: 20px; }
        h1 { color: #f8fafc; font-size: 1.5rem; }
        .controls { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        input, select, button { padding: 8px 12px; font-family: monospace; font-size: 1rem; border-radius: 4px; border: 1px solid #38bdf8; background: #1e293b; color: #f8fafc; }
        button { background: #0284c7; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .node-card { background: #1e293b; border: 1px solid #334155; border-left: 4px solid #38bdf8; padding: 15px; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .node-card h3 { margin: 0 0 10px 0; color: #38bdf8; font-size: 1.1rem; }
        .node-card p { margin: 4px 0; color: #94a3b8; font-size: 0.9rem; }
        #status { margin-bottom: 15px; color: #fbbf24; font-style: italic; }
    </style>
</head>
<body>

    <h1>Kali Network Topology Scanner (Stealth Mode)</h1>
    
    <div class="controls">
        <div>
            <label for="subnet">Target CIDR: </label>
            <input type="text" id="subnet" value="192.168.1.0/24">
        </div>
        <div>
            <label for="speed">Pacing Speed: </label>
            <select id="speed">
                <option value="0.01">Aggressive (Fast)</option>
                <option value="0.05" selected>Normal (Balanced)</option>
                <option value="0.2">Stealth (Slow & Quiet)</option>
            </select>
        </div>
        <button onclick="startScan()">Run Stealth Sweep</button>
    </div>

    <div id="status">Status: Ready to scan...</div>
    <div class="grid" id="nodeContainer"></div>

    <script>
        let ws;

        function startScan() {
            const container = document.getElementById('nodeContainer');
            container.innerHTML = ''; 
            const statusDiv = document.getElementById('status');
            const target = document.getElementById('subnet').value;
            const speed = document.getElementById('speed').value;

            ws = new WebSocket('ws://localhost:8000/ws/scan');

            ws.onopen = () => {
                statusDiv.innerText = `Status: Scanning ${target} with pacing speed ${speed}s...`;
                ws.send(JSON.stringify({ target: target, speed: speed }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'status') {
                    statusDiv.innerText = `Status: ${data.message}`;
                } else if (data.type === 'host_discovered') {
                    const card = document.createElement('div');
                    card.className = 'node-card';
                    card.innerHTML = `
                        <h3>Discovered Endpoint</h3>
                        <p><strong>IP:</strong> ${data.ip}</p>
                        <p><strong>MAC:</strong> ${data.mac}</p>
                    `;
                    container.appendChild(card);
                }
            };

            ws.onerror = (error) => {
                statusDiv.innerText = `Status: WebSocket error occurred.`;
                console.error(error);
            };

            ws.onclose = () => {
                statusDiv.innerText += ` (Connection closed)`;
            };
        }
    </script>
</body>
</html>
